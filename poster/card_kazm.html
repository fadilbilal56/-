<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Amiri;src:url(Amiri-Regular.ttf);font-weight:400}
@font-face{font-family:Amiri;src:url(Amiri-Bold.ttf);font-weight:700}
@font-face{font-family:Cairo;src:url(Cairo.ttf)}
*{margin:0;box-sizing:border-box}html{width:1080px;height:1350px;overflow:hidden;background:#12254d}
body{direction:rtl;width:1080px;height:1350px;font-family:Amiri,serif;
background:radial-gradient(circle at 20% 10%,#0f9d8a 0,transparent 45%),radial-gradient(circle at 85% 90%,#7b3fa0 0,transparent 50%),linear-gradient(160deg,#0b3d4a,#12254d 60%,#2a1650);
display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.dot{position:absolute;border-radius:50%;opacity:.18;background:#ffd36b}
.frame{width:960px;height:1230px;border:6px solid #ffd36b;border-radius:48px;position:relative;
background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));padding:22px}
.inner{height:100%;border:2px dashed rgba(255,211,107,.6);border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 60px;text-align:center}
.star{font-size:90px;color:#ffd36b;line-height:1}
.title{font-family:Cairo;font-weight:700;color:#7ff0d8;font-size:34px;letter-spacing:1px;margin:18px 0 34px;padding:8px 36px;border-radius:40px;background:rgba(127,240,216,.12);border:1.5px solid rgba(127,240,216,.5)}
.verse{font-size:68px;line-height:2.05;font-weight:700;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.4)}
.verse .h{color:#ffd36b}
.sep{margin:34px 0 22px;color:#ffd36b;font-size:40px;letter-spacing:14px}
.src{font-family:Cairo;color:#ffe9a8;font-size:32px}
.foot{margin-top:26px;font-size:36px;color:#c9f7ee}
</style></head><body>
<div class="dot" style="width:300px;height:300px;top:-90px;right:780px"></div>
<div class="dot" style="width:220px;height:220px;bottom:-60px;right:910px;background:#7ff0d8"></div>
<div class="frame"><div class="inner">
<div class="star">❁</div>
<div class="title">من صفات المتقين</div>
<div class="verse">﴿الَّذِينَ يُنفِقُونَ فِي السَّرَّاءِ وَالضَّرَّاءِ وَ<span class="h">الْكَاظِمِينَ الْغَيْظَ</span> وَ<span class="h">الْعَافِينَ عَنِ النَّاسِ</span> ۗ وَاللَّهُ يُحِبُّ الْمُحْسِنِينَ﴾</div>
<div class="sep">• • •</div>
<div class="src">سورة آل عمران — الآية ١٣٤</div>
<div class="foot">اللهم اجعلنا من المحسنين 🤍</div>
</div></div></body></html>
