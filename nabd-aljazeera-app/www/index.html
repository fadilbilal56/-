<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: capacitor: http://localhost; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com">
<meta name="theme-color" content="#0d6b3a">
<title>نبض الجزيرة</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="appbar">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#fff"/><polyline points="8,34 20,34 25,22 31,46 37,16 42,34 56,34" fill="none" stroke="#0d6b3a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="name">نبض <b>الجزيرة</b></span>
  </div>
  <button class="icon-btn" id="searchBtn" aria-label="بحث">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
  </button>
</header>

<div class="searchbar" id="searchbar" hidden>
  <input id="searchInput" type="search" placeholder="ابحث في الأخبار…" enterkeyhint="search">
  <button id="searchGo">بحث</button>
</div>

<nav class="cats" id="cats" aria-label="الأقسام"></nav>

<div class="ticker" id="ticker" hidden>
  <span class="label">عاجل</span>
  <div class="track"><div class="items" id="tickerItems"></div></div>
</div>

<div class="offline" id="offline" hidden>لا يوجد اتصال بالإنترنت – تعرض آخر أخبار محفوظة</div>
<div class="demo" id="demo" hidden>محتوى تجريبي – سيظهر محتوى الصحيفة بعد ربط التطبيق بالموقع</div>

<main id="view" class="view"></main>

<!-- article overlay -->
<section class="article" id="article" hidden aria-modal="true" role="dialog">
  <header class="article-bar">
    <button class="icon-btn" id="backBtn" aria-label="رجوع">
      <svg viewBox="0 0 24 24"><polyline points="9,5 16,12 9,19"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="icon-btn" id="fontBtn" aria-label="حجم الخط"><span class="aa">أ<small>أ</small></span></button>
    <button class="icon-btn" id="saveBtn" aria-label="حفظ">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
    </button>
    <button class="icon-btn" id="shareBtn" aria-label="مشاركة">
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><line x1="8.2" y1="10.8" x2="15.8" y2="6.2"/><line x1="8.2" y1="13.2" x2="15.8" y2="17.8"/></svg>
    </button>
  </header>
  <div class="article-scroll" id="articleScroll"></div>
</section>

<nav class="tabbar" aria-label="التنقل">
  <button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>الرئيسية</span></button>
  <button data-tab="sections"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>الأقسام</span></button>
  <button data-tab="saved"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>المحفوظات</span></button>
  <button data-tab="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="17"/><circle cx="12" cy="7.5" r=".6"/></svg><span>عن الصحيفة</span></button>
</nav>

<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="demo-data.js"></script>
<script src="app.js"></script>
</body>
</html>
