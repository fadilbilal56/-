<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>صورة القناة</title>
<link rel="stylesheet" href="../assets/kids.css"><script src="../assets/chars.js"></script>
<style>
/* YouTube crops the avatar to a circle: keep everything inside the central circle */
body{width:800px;height:800px;background:radial-gradient(circle at 50% 35%,#c9f0ff,#7fd3f7 75%)}
.hill{position:absolute;bottom:-330px;left:-100px;width:1000px;height:560px;border-radius:50%;background:#6cc551}
.noor{position:absolute;top:70px;left:50%;transform:translateX(-50%)}
.t{position:absolute;bottom:140px;width:100%;text-align:center;font-weight:900;font-size:92px;color:#fff;-webkit-text-stroke:11px #2b2350;paint-order:stroke fill}
.t span{color:#ffc93c}
</style></head><body>
<div class="hill"></div>
<div class="noor" id="n"></div>
<div class="t">بُستان <span>القِيَم</span></div>
<script>n.innerHTML=noor({size:420,mood:'happy'})</script>
</body></html>
