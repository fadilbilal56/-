<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>صورة مصغرة الحلقة ١</title>
<link rel="stylesheet" href="../assets/kids.css"><script src="../assets/chars.js"></script>
<style>
body{width:1280px;height:720px;background:radial-gradient(circle at 75% 40%,#fff3a8,#ffc93c 70%)}
.burst{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 72% 45%,rgba(255,255,255,.22) 0 8deg,transparent 8deg 20deg)}
.t{position:absolute;top:60px;right:50px;width:640px;text-align:center}
.t h1{font-size:118px;font-weight:900;line-height:1.08;color:#fff;-webkit-text-stroke:14px #2b2350;paint-order:stroke fill}
.t h1 span{color:#ff5d73}
.t .k{display:inline-block;margin-top:24px;font-size:42px;font-weight:900;color:#fff;background:#1fa37a;padding:6px 32px;border-radius:999px;box-shadow:0 6px 0 #157a5b}
.ep{position:absolute;bottom:40px;right:60px;font-size:36px;font-weight:900;color:#2b2350;background:#fff;padding:6px 28px;border-radius:999px}
.abs{position:absolute}
.logo{position:absolute;top:26px;left:30px;font-weight:900;font-size:34px;color:#fff;-webkit-text-stroke:6px #2b2350;paint-order:stroke fill}.logo span{color:#ffc93c}
</style></head><body>
<div class="burst"></div>
<div class="logo">بُستان <span>القِيَم</span></div>
<div class="abs" style="bottom:20px;left:40px" id="g"></div>
<div class="abs" style="bottom:20px;left:300px" id="k"></div>
<div class="abs" style="top:150px;left:270px" id="h1"></div><div class="abs" style="top:90px;left:400px" id="h2"></div>
<div class="t"><h1>هديّةٌ<br><span>لجدّتي!</span></h1><div class="k">صِلةُ الرَّحِم 💛</div></div>
<div class="ep">الحلقة ١</div>
<script>g.innerHTML=granny({size:290,arms:true});k.innerHTML=kid({type:'girl',size:250,hold:'gift'});h1.innerHTML=heart(90);h2.innerHTML=heart(60,'#ff8fb8');</script>
</body></html>
