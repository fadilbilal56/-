<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>المشهد ٤</title>
<link rel="stylesheet" href="scene.css"><script src="../../assets/chars.js"></script>
<style>
body{background:radial-gradient(circle at 70% 30%,#3a2f7a,#1d1745 75%)}
.st{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff}
.card{position:absolute;top:150px;right:120px;width:1160px;background:#fffaf0;border-radius:48px;padding:56px 70px 46px;box-shadow:0 18px 0 rgba(0,0,0,.25);text-align:center;border:8px solid #ffc93c}
.card .lab{position:absolute;top:-34px;right:60px;background:#ff7b6b;color:#fff;font-weight:900;font-size:40px;padding:6px 34px;border-radius:999px}
.card .q{font-size:38px;font-weight:800;color:#6b6290}
.card .h{font-family:Amiri;font-weight:700;font-size:70px;line-height:1.75;color:#2b2350;margin:12px 0}
.card .h em{font-style:normal;color:#1fa37a}
.card .src{font-size:30px;color:#8a83a8;font-weight:700}
.mean{position:absolute;bottom:90px;right:120px;width:1160px;background:#ffc93c;border-radius:36px;padding:26px 40px;font-size:46px;font-weight:800;text-align:center;box-shadow:0 10px 0 #e89a10}
</style></head><body>
<div id="stars"></div>
<div class="ep" style="background:#ffc93c;color:#2b2350">المشهد ٤</div>
<div class="card"><span class="lab">حديثُ اليوم</span>
  <div class="q">قال رسولُ الله ﷺ:</div>
  <div class="h">«مَن سَرَّهُ أن <em>يُبسَطَ لهُ في رِزقِه</em>،<br>و<em>يُنسَأَ لهُ في أثَرِه</em>، فَلْيَصِلْ رَحِمَه»</div>
  <div class="src">متفقٌ عليه</div>
</div>
<div class="mean">يعني: اللهُ يُباركُ في رِزقِك وعُمُرِك إذا وَصَلتَ أقاربَك 💛</div>
<div class="abs" style="bottom:200px;left:110px" id="n"></div>
<script>
n.innerHTML=noor({size:420,mood:'happy'});
let s='';for(let i=0;i<60;i++){s+=`<i class="st" style="top:${(Math.sin(i*12.9)*0.5+0.5)*1040}px;left:${(Math.cos(i*7.3)*0.5+0.5)*1900}px;opacity:${.3+((i*37)%7)/10}"></i>`}stars.innerHTML=s;
</script>
</body></html>
